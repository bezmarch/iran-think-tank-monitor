<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Iran Think-Tank Monitor</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#8a1538}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}
header{background:#111827;color:white;padding:34px 20px}.wrap{max-width:1050px;margin:auto}
h1{margin:0 0 8px;font-size:32px}.subtitle{color:#d0d5dd}
.controls{display:grid;grid-template-columns:1fr 220px;gap:12px;margin:24px 0}
input,select{width:100%;padding:13px;border:1px solid var(--line);border-radius:10px;background:white;font-size:15px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.pill{background:white;border:1px solid var(--line);padding:8px 12px;border-radius:99px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin:13px 0;box-shadow:0 2px 8px rgba(16,24,40,.04)}
.source{font-weight:700;color:var(--accent);font-size:14px}.title{font-size:21px;line-height:1.3;margin:7px 0}
.title a{color:var(--text);text-decoration:none}.title a:hover{text-decoration:underline}
.meta,.summary{color:var(--muted);line-height:1.5}.meta{font-size:13px}.empty{background:white;padding:30px;border-radius:14px;text-align:center;color:var(--muted)}
footer{padding:30px 0 50px;color:var(--muted);font-size:13px}
@media(max-width:650px){.controls{grid-template-columns:1fr}h1{font-size:27px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Iran Think-Tank Monitor</h1>
<div class="subtitle">Iran-related publications from selected international think tanks during the past 24 hours</div></div></header>
<main class="wrap" style="padding:0 18px">
<div class="controls">
<input id="search" placeholder="Search title, summary or think tank…">
<select id="source"><option value="">All think tanks</option></select>
</div>
<div class="stats" id="stats"></div>
<div id="results"><div class="empty">Loading latest report…</div></div>
<footer>Automated monitor. Publication dates and RSS availability are controlled by the source websites.</footer>
</main>
<script>
let DATA={items:[]};
const esc=s=>(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function relative(iso){const d=new Date(iso),h=Math.round((Date.now()-d)/36e5);return h<=0?"less than an hour ago":h===1?"1 hour ago":h+" hours ago"}
function render(){
 const q=document.querySelector("#search").value.toLowerCase();
 const s=document.querySelector("#source").value;
 const items=DATA.items.filter(x=>(!s||x.source===s)&&(!q||(x.title+" "+x.summary+" "+x.source).toLowerCase().includes(q)));
 document.querySelector("#stats").innerHTML=
 `<span class="pill"><b>${items.length}</b> matching items</span>
  <span class="pill">${DATA.source_count||0} monitored sources</span>
  <span class="pill">Updated ${DATA.generated_utc?relative(DATA.generated_utc):"—"}</span>`;
 document.querySelector("#results").innerHTML=items.length?items.map(x=>`
 <article class="card">
   <div class="source">${esc(x.source)}</div>
   <div class="title"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div>
   <div class="meta">${relative(x.published_utc)} · ${new Date(x.published_utc).toLocaleString()}</div>
   ${x.summary?`<p class="summary">${esc(x.summary)}</p>`:""}
 </article>`).join(""):`<div class="empty">No matching items were found in the current 24-hour window.</div>`;
}
fetch("data.json?"+Date.now()).then(r=>r.json()).then(d=>{
 DATA=d;
 const names=[...new Set(d.items.map(x=>x.source))].sort();
 document.querySelector("#source").innerHTML='<option value="">All think tanks</option>'+names.map(n=>`<option>${esc(n)}</option>`).join("");
 render();
}).catch(()=>document.querySelector("#results").innerHTML='<div class="empty">The first scan has not run yet. Open the repository’s Actions tab and run “Update Iran monitor”.</div>');
document.querySelector("#search").addEventListener("input",render);
document.querySelector("#source").addEventListener("change",render);
</script>
</body></html>
