<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Iran Intelligence Monitor</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--accent:#8a1538;--nav:#111827;--green:#067647;--amber:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,Arial,sans-serif}header{background:var(--nav);color:#fff;padding:30px 20px}.wrap{max-width:1220px;margin:auto}h1{margin:0 0 7px;font-size:32px}.subtitle{color:#d0d5dd}.nav,.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{border:1px solid var(--line);background:#fff;color:#475467;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.tab.active{background:#172033;color:#fff;border-color:#172033}.controls{display:grid;grid-template-columns:1.5fr repeat(6,minmax(130px,1fr));gap:10px;margin-bottom:16px}input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:17px}.pill{background:#fff;border:1px solid var(--line);padding:8px 11px;border-radius:999px;color:var(--muted)}.card,.cluster{background:#fff;border:1px solid var(--line);border-radius:14px;padding:19px;margin:12px 0;box-shadow:0 2px 8px rgba(16,24,40,.04)}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.eyebrow{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.source{font-weight:800;color:var(--accent)}.badge{font-size:11px;font-weight:700;background:#f2f4f7;color:#475467;padding:4px 7px;border-radius:6px}.importance{white-space:nowrap;font-size:13px;font-weight:700;background:#f2f4f7;padding:6px 9px;border-radius:999px}.title{font-size:20px;line-height:1.3;margin:9px 0}.title a{color:var(--text);text-decoration:none}.title a:hover{text-decoration:underline}.meta,.summary{color:var(--muted);line-height:1.5}.meta{font-size:13px}.summary{margin:10px 0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.tag{font-size:12px;background:#f9fafb;border:1px solid var(--line);padding:5px 8px;border-radius:999px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}.actions button,.cluster summary{cursor:pointer}.actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 9px}.actions button.active{background:#172033;color:#fff}.cluster-title{font-size:22px;font-weight:800;margin:7px 0}.cluster-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:13px 0}.metric{background:#f9fafb;border:1px solid var(--line);border-radius:10px;padding:10px}.metric b{display:block;font-size:18px}.metric span{font-size:12px;color:var(--muted)}.emerging{border-left:5px solid var(--green)}.outlier{border-left:5px solid var(--amber)}details{margin-top:10px}details summary{font-weight:750;color:var(--accent)}.cluster-item{padding:11px 0;border-top:1px solid var(--line)}.cluster-item:first-child{border-top:0}.health{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;align-items:center;padding:12px;background:#fff;border-bottom:1px solid var(--line)}.health:first-child{border-radius:12px 12px 0 0}.health:last-child{border-radius:0 0 12px 12px}.good{color:var(--green);font-weight:800}.quiet{color:var(--amber);font-weight:800}.empty{background:#fff;border:1px dashed var(--line);border-radius:12px;padding:28px;text-align:center;color:var(--muted)}.translation{background:#f8fafc;border-left:3px solid var(--accent);padding:12px;margin-top:10px;border-radius:8px}.translation-label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:800;color:var(--accent);margin-bottom:6px}.translated-title{font-size:18px;font-weight:750;line-height:1.35;margin-bottom:7px}.translated-summary{color:var(--muted);line-height:1.55;margin:0}.translation-error{font-size:12px;color:#b42318}.small{font-size:12px;color:var(--muted)}@media(max-width:950px){.controls{grid-template-columns:1fr 1fr}.cluster-grid{grid-template-columns:1fr 1fr}.health{grid-template-columns:1fr 1fr}}@media(max-width:600px){.controls{grid-template-columns:1fr}.top{display:block}.importance{display:inline-block;margin-top:8px}}
.pagebar{background:#fff;border-bottom:1px solid var(--line)}.pagebar .wrap{display:flex;gap:18px;align-items:center;padding:12px 20px;flex-wrap:wrap}.pagebar a{color:#475467;text-decoration:none;font-weight:750}.pagebar a.active{color:var(--accent)}.refreshbox{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}.refreshbox button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 10px;cursor:pointer}.scanline{font-size:12px;color:var(--muted)}
</style></head><body data-page="dashboard"><header><div class="wrap"><h1>Iran Intelligence Monitor</h1><div class="subtitle">News, analysis, official sources and cross-language story intelligence</div></div></header><div class="pagebar"><div class="wrap"><a href="index.html" data-page="dashboard">Dashboard</a><a href="stories.html" data-page="stories">Stories</a><a href="articles.html" data-page="articles">Articles</a><a href="sources.html" data-page="sources">Sources</a><div class="refreshbox"><span class="scanline" id="updatedLine">Loading update time…</span><button id="refreshBtn">Refresh now</button><button id="refreshSetup">Refresh settings</button></div></div></div><main class="wrap">
<div class="nav" id="viewTabs"><button class="tab active" data-view="feed">Article feed</button><button class="tab" data-view="stories">Story clusters</button><button class="tab" data-view="emerging">Emerging</button><button class="tab" data-view="outliers">Outliers</button><button class="tab" data-view="health">Source health</button></div>
<div class="tabs" id="contentTabs"><button class="tab active" data-content="">All content</button><button class="tab" data-content="news">News</button><button class="tab" data-content="analysis">Analysis & research</button><button class="tab" data-content="official">Official statements</button></div>
<div class="tabs" id="languageTabs"><button class="tab active" data-langgroup="">All languages</button><button class="tab" data-langgroup="en">English</button><button class="tab" data-langgroup="other">Other languages</button></div>
<div class="controls"><input id="search" placeholder="Search headlines, summaries, sources..."><select id="source"><option value="">All organisations</option></select><select id="country"><option value="">All countries</option></select><select id="topic"><option value="">All topics</option></select><select id="importance"><option value="1">All importance</option><option value="3">3★ and above</option><option value="4">4★ and above</option><option value="5">5★ only</option></select><select id="time"><option value="0">All archive</option><option value="24">Last 24 hours</option><option value="72">Last 3 days</option><option value="168">Last 7 days</option><option value="240">Last 10 days</option></select><select id="sort"><option value="newest">Newest first</option><option value="importance">Importance</option><option value="source">Source</option></select></div>
<div class="stats" id="stats"></div><section id="results"><div class="empty">Loading latest report…</div></section></main>
<script>
const PAGE=document.body.dataset.page||'dashboard';let DATA={items:[],clusters:[]},view=PAGE==='stories'?'stories':PAGE==='sources'?'health':'feed',content='',langgroup='';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const stars=n=>'★'.repeat(n)+'☆'.repeat(5-n);const rel=iso=>{const d=(Date.now()-new Date(iso))/1000;if(d<3600)return Math.max(1,Math.round(d/60))+'m ago';if(d<86400)return Math.round(d/3600)+'h ago';return Math.round(d/86400)+'d ago'};const utc=iso=>new Date(iso).toLocaleString('en-GB',{timeZone:'UTC',day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+' UTC';
function key(x){let s=x.url||x.source+'|'+x.title,h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h)^s.charCodeAt(i);return(h>>>0).toString(36)}function group(x){return localStorage.getItem('iim-cat:'+key(x))||x.content_group||'news'}function kind(x){const g=group(x);return localStorage.getItem('iim-cat:'+key(x))?'Manually classified: '+g:(x.content_kind||g)}
function filteredItems(){const q=$('search').value.toLowerCase(),src=$('source').value,country=$('country').value,topic=$('topic').value,min=+$('importance').value,hours=+$('time').value,cut=hours?Date.now()-hours*3600000:0;let a=DATA.items.filter(x=>{const hay=(x.title+' '+(x.summary||'')+' '+x.source+' '+(x.tags||[]).join(' ')).toLowerCase(),t=new Date(x.published_utc).getTime(),lg=(x.language_code||'en');return(!content||group(x)===content)&&(!langgroup||(langgroup==='en'?lg==='en':lg!=='en'))&&(!src||x.source===src)&&(!country||x.country===country)&&(!topic||(x.tags||[]).includes(topic))&&(x.importance_score||1)>=min&&(!hours||t>=cut)&&(!q||hay.includes(q))});const sort=$('sort').value;a.sort((a,b)=>sort==='importance'?(b.importance_score-a.importance_score)||new Date(b.published_utc)-new Date(a.published_utc):sort==='source'?a.source.localeCompare(b.source):new Date(b.published_utc)-new Date(a.published_utc));return a}
function article(x,compact=false){const non=(x.language_code||'en')!=='en',k=key(x),g=group(x),manual=localStorage.getItem('iim-cat:'+k);return `<article class="card"><div class="top"><div class="eyebrow"><span class="source">${esc(x.source)}</span><span class="badge">${esc(x.language||'English')}</span><span class="badge">${esc(x.source_type||'source')}</span>${x.ownership?`<span class="badge">${esc(x.ownership)}</span>`:''}</div><div class="importance">${stars(x.importance_score||1)} ${esc(x.importance_label||'')}</div></div><div class="title"><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a></div><div class="meta">${esc(x.country||'International')} · ${esc(kind(x))} · ${utc(x.published_utc)} · ${rel(x.published_utc)}</div>${x.summary?`<p class="summary">${esc(x.summary)}</p>`:''}<div class="actions">${!compact?`<button data-cat="news" data-k="${k}" class="${g==='news'?'active':''}">News</button><button data-cat="analysis" data-k="${k}" class="${g==='analysis'?'active':''}">Analysis</button><button data-cat="official" data-k="${k}" class="${g==='official'?'active':''}">Official</button>${manual?`<button data-cat="reset" data-k="${k}">Use automatic</button>`:''}`:''}${non?`<button data-translate="${k}" data-lang="${esc(x.language_code)}" data-title="${esc(x.title)}" data-summary="${esc(x.summary||'')}">🇬🇧 Translate to English</button>`:''}</div>${non?`<div id="tr-${k}" hidden></div>`:''}${!compact?`<div class="tags">${(x.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div>`:''}</article>`}
function clusterCard(c){const cls=c.is_emerging?'cluster emerging':c.is_outlier?'cluster outlier':'cluster';return `<article class="${cls}"><div class="eyebrow">${c.is_emerging?'<span class="badge">▲ Emerging</span>':''}${c.is_outlier?'<span class="badge">Outlier</span>':''}<span class="badge">${c.content_counts?.news||0} news</span><span class="badge">${c.content_counts?.analysis||0} analysis</span><span class="badge">${c.content_counts?.official||0} official</span></div><div class="cluster-title">${esc(c.headline)}</div><div class="meta">Latest ${rel(c.latest_utc)} · ${(c.tags||[]).join(' · ')}</div><div class="cluster-grid"><div class="metric"><b>${c.source_count}</b><span>sources</span></div><div class="metric"><b>${c.language_count}</b><span>languages</span></div><div class="metric"><b>${c.country_count}</b><span>countries</span></div><div class="metric"><b>${stars(c.confidence_score||1)}</b><span>confidence</span></div><div class="metric"><b>${stars(Math.round(c.reliability_score||3))}</b><span>reliability</span></div></div><div class="small">Sources: ${(c.sources||[]).map(esc).join(', ')}</div><details><summary>Show ${c.items.length} article${c.items.length===1?'':'s'}</summary>${c.items.map(x=>`<div class="cluster-item">${article(x,true)}</div>`).join('')}</details></article>`}
function render(){let html='';if(view==='feed'){const a=filteredItems();stats(`${a.length} matching articles`,`${DATA.source_count||0} monitored sources`,`${DATA.archive_days||10}-day archive`);html=a.map(x=>article(x)).join('')||empty()}else if(view==='stories'||view==='emerging'||view==='outliers'){let allowed=new Set(filteredItems().map(x=>x.url));let cs=(DATA.clusters||[]).map(c=>({...c,items:c.items.filter(x=>allowed.has(x.url))})).filter(c=>c.items.length);cs.forEach(c=>{c.source_count=new Set(c.items.map(x=>x.source)).size;c.language_count=new Set(c.items.map(x=>x.language)).size;c.country_count=new Set(c.items.map(x=>x.country)).size});if(view==='emerging')cs=cs.filter(c=>c.is_emerging).sort((a,b)=>b.emerging_score-a.emerging_score);if(view==='outliers')cs=cs.filter(c=>c.is_outlier);stats(`${cs.length} ${view==='stories'?'story clusters':view}`,`${DATA.emerging_count||0} emerging`,`${DATA.outlier_count||0} outliers`);html=cs.map(clusterCard).join('')||empty()}else{const ss=DATA.source_status||[];stats(`${ss.length} sources checked`,'Active = Iran items found','Quiet = no matching Iran items');html=ss.map(s=>`<div class="health"><b>${esc(s.source)}</b><span class="${s.items?'good':'quiet'}">${s.items?'● Active':'● Quiet'}</span><span>${esc(s.method||'none')}</span><span>${s.items||0} items</span></div>`).join('')||empty()}$('results').innerHTML=html;bind()}
function stats(...x){$('stats').innerHTML=x.map(v=>`<span class="pill">${v}</span>`).join('')}function empty(){return'<div class="empty">No items match the current filters.</div>'}function $(id){return document.getElementById(id)}
const langMap={de:'de',fr:'fr',it:'it',es:'es',ru:'ru',tr:'tr',he:'iw',zh:'zh-CN',ja:'ja',ko:'ko',nl:'nl',pl:'pl',pt:'pt',el:'el',az:'az'};
async function translateText(text,sourceLang){if(!text)return'';const sl=langMap[sourceLang]||sourceLang||'auto',url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sl)}&tl=en&dt=t&q=${encodeURIComponent(text)}`;const r=await fetch(url);if(!r.ok)throw new Error('Translation unavailable');const data=await r.json();return(data[0]||[]).map(p=>p[0]||'').join('').trim()}
function bind(){document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{const x=DATA.items.find(i=>key(i)===b.dataset.k);if(!x)return;b.dataset.cat==='reset'?localStorage.removeItem('iim-cat:'+key(x)):localStorage.setItem('iim-cat:'+key(x),b.dataset.cat);render()});document.querySelectorAll('[data-translate]').forEach(b=>b.onclick=async()=>{const box=$('tr-'+b.dataset.translate),cacheKey='iim-tr:'+b.dataset.translate;if(!box)return;if(!box.hidden){box.hidden=true;b.textContent='🇬🇧 Translate to English';return}const cached=localStorage.getItem(cacheKey);if(cached){const v=JSON.parse(cached);box.innerHTML=`<div class="translation"><div class="translation-label">English translation</div><div class="translated-title">${esc(v.title)}</div>${v.summary?`<p class="translated-summary">${esc(v.summary)}</p>`:''}</div>`;box.hidden=false;b.textContent='Hide English';return}b.disabled=true;b.textContent='Translating…';try{const[title,summary]=await Promise.all([translateText(b.dataset.title,b.dataset.lang),translateText(b.dataset.summary,b.dataset.lang)]);localStorage.setItem(cacheKey,JSON.stringify({title,summary}));box.innerHTML=`<div class="translation"><div class="translation-label">English translation</div><div class="translated-title">${esc(title)}</div>${summary?`<p class="translated-summary">${esc(summary)}</p>`:''}</div>`;box.hidden=false;b.textContent='Hide English'}catch(e){const text=[b.dataset.title,b.dataset.summary].filter(Boolean).join('\n\n'),u=`https://translate.google.com/?sl=auto&tl=en&text=${encodeURIComponent(text)}&op=translate`;box.innerHTML=`<div class="translation"><div class="translation-error">Inline translation was unavailable. <a href="${u}" target="_blank" rel="noopener">Open this text in Google Translate</a>.</div></div>`;box.hidden=false;b.textContent='Try translation again'}finally{b.disabled=false}})}
fetch('data.json?'+Date.now()).then(r=>r.json()).then(d=>{DATA=d;const st=d.scan_stats||{};$('updatedLine').textContent=`Updated ${utc(d.generated_utc)} · ${st.checked_sources||0} checked · ${st.new_items||0} new · ${st.runtime_seconds||0}s`; const uniq=k=>[...new Set(d.items.map(x=>x[k]).filter(Boolean))].sort();$('source').innerHTML='<option value="">All organisations</option>'+uniq('source').map(x=>`<option>${esc(x)}</option>`).join('');$('country').innerHTML='<option value="">All countries</option>'+uniq('country').map(x=>`<option>${esc(x)}</option>`).join('');const topics=[...new Set(d.items.flatMap(x=>x.tags||[]))].sort();$('topic').innerHTML='<option value="">All topics</option>'+topics.map(x=>`<option>${esc(x)}</option>`).join('');render()}).catch(e=>$('results').innerHTML='<div class="empty">The report could not be loaded. Run “Update Iran monitor” in GitHub Actions.</div>');
['search','source','country','topic','importance','time','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));document.querySelectorAll('#viewTabs .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#viewTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');view=b.dataset.view;render()});document.querySelectorAll('#contentTabs .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#contentTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');content=b.dataset.content;render()});document.querySelectorAll('#languageTabs .tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('#languageTabs .tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');langgroup=b.dataset.langgroup;render()});

function refreshConfig(){try{return JSON.parse(localStorage.getItem('iim-gh-refresh')||'null')}catch(e){return null}}
function setupRefresh(){const current=refreshConfig()||{};const owner=prompt('GitHub username or organisation',current.owner||'');if(!owner)return;const repo=prompt('Repository name',current.repo||'');if(!repo)return;const workflow=prompt('Workflow filename',current.workflow||'update.yml')||'update.yml';const token=prompt('GitHub fine-grained token with Actions write permission. It is stored only in this browser.',current.token||'');if(!token)return;localStorage.setItem('iim-gh-refresh',JSON.stringify({owner,repo,workflow,token}));alert('Refresh settings saved in this browser.')}
async function triggerRefresh(){let c=refreshConfig();if(!c){setupRefresh();c=refreshConfig();if(!c)return}const b=$('refreshBtn');b.disabled=true;b.textContent='Starting…';try{const r=await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/actions/workflows/${encodeURIComponent(c.workflow)}/dispatches`,{method:'POST',headers:{Accept:'application/vnd.github+json',Authorization:`Bearer ${c.token}`,'X-GitHub-Api-Version':'2022-11-28'},body:JSON.stringify({ref:'main'})});if(!r.ok)throw new Error(await r.text());b.textContent='Update started';setTimeout(()=>{b.disabled=false;b.textContent='Refresh now'},8000)}catch(e){b.disabled=false;b.textContent='Refresh failed';alert('GitHub could not start the workflow. Check the repository, workflow filename and token permissions.')}}
$('refreshBtn').onclick=triggerRefresh;$('refreshSetup').onclick=setupRefresh;document.querySelectorAll('.pagebar a').forEach(a=>{if(a.dataset.page===PAGE)a.classList.add('active')});
</script></body></html>
